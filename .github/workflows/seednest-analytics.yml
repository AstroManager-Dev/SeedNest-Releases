name: SeedNest Website (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'stats/**'
      - 'latest.json'
      - '.github/workflows/seednest-analytics.yml'
      - 'scripts/check_latest.py'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: seednest-public-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Branded website and stable APK download
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate current released APK metadata
        run: python3 scripts/check_latest.py
      - name: Include approved version manifest in static site
        run: cp latest.json stats/latest.json
      - name: Assert no public analytics history is published
        run: |
          test -f stats/index.html
          test -f stats/admin/index.html
          test -f stats/changelog/index.html
          test -f stats/download/index.html
          test ! -e stats/data/history.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: stats
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
